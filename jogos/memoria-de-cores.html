<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111526">
<meta name="description" content="Memória de Cores: observe a sequência e repita no seu ritmo."><title>Memória de Cores — Clicklogos</title>
<style>
:root{color-scheme:dark;--bg:#101323;--panel:#191e33;--line:#343b58;--text:#f6f4ff;--muted:#a8acc6;--accent:#c2a7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at top,#29234b,#101323 65%)}.wrap{width:min(700px,100%);margin:auto}.back{display:inline-flex;margin-bottom:18px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#1a2037;color:var(--text);font-weight:750;text-decoration:none}.back:hover{border-color:var(--accent);color:var(--accent)}header{text-align:center;margin-bottom:20px}.eyebrow{font-size:.75rem;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;margin:10px 0}header p{color:var(--muted);margin:0}.panel{padding:clamp(18px,4vw,28px);border:1px solid var(--line);border-radius:22px;background:rgba(25,30,51,.96);box-shadow:0 24px 70px #0005}.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.stat{padding:11px 14px;background:#111629;border:1px solid var(--line);border-radius:12px;flex:1}.stat span{display:block;color:var(--muted);font-size:.78rem}.stat strong{font-size:1.35rem}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(390px,100%);margin:0 auto 18px}.tile{aspect-ratio:1;border:2px solid #ffffff20;border-radius:22px;cursor:pointer;opacity:.82;transition:transform .12s,filter .12s,opacity .12s;box-shadow:inset 0 1px 0 #ffffff30,0 10px 22px #0003}.tile:hover:enabled{transform:scale(1.025);opacity:1}.tile:focus-visible{outline:3px solid white;outline-offset:3px}.tile:disabled{cursor:default}.tile.lit{filter:brightness(1.75) saturate(1.2);opacity:1;transform:scale(.97);box-shadow:0 0 35px currentColor,inset 0 1px 0 #ffffff70}.t1{background:#f475a8;color:#f475a8}.t2{background:#71a7ff;color:#71a7ff}.t3{background:#ffc25e;color:#ffc25e}.t4{background:#61d8bd;color:#61d8bd}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{padding:12px 18px;border:0;border-radius:10px;background:#c2a7ff;color:#171329;font:inherit;font-weight:850;cursor:pointer;min-height:46px}.btn.alt{background:#2a304a;border:1px solid #464e70;color:var(--text)}.btn:disabled{opacity:.5;cursor:not-allowed}.status{text-align:center;min-height:28px;margin:16px 0 0;color:#d6d2ec}.help{text-align:center;margin:14px 0 0;color:var(--muted);font-size:.85rem;line-height:1.5}.hidden{display:none!important}@media(max-width:480px){body{padding:14px}.board{gap:9px}.tile{border-radius:16px}.stats{gap:8px}.stat{padding:9px 11px}}
</style></head><body><main class="wrap">
<a class="back" href="../" aria-label="Voltar ao menu inicial">← Voltar ao menu</a>
<header><div class="eyebrow">Desafio de memória</div><h1>Memória de Cores</h1><p>Observe a sequência luminosa e repita na ordem certa.</p></header>
<section class="panel" aria-label="Jogo de memória de cores"><div class="stats"><div class="stat"><span>Rodada</span><strong id="round">0</strong></div><div class="stat"><span>Recorde nesta sessão</span><strong id="best">0</strong></div></div>
<div class="board" role="group" aria-label="Quatro cores para repetir"><button class="tile t1" data-tile="0" aria-label="Rosa" disabled></button><button class="tile t2" data-tile="1" aria-label="Azul" disabled></button><button class="tile t3" data-tile="2" aria-label="Âmbar" disabled></button><button class="tile t4" data-tile="3" aria-label="Verde água" disabled></button></div>
<div class="controls"><button class="btn" id="start">Começar</button><button class="btn alt hidden" id="repeat">Repetir sequência</button></div><p class="status" id="status" aria-live="polite">Pronto? Toque em Começar para jogar.</p><p class="help">A sequência cresce a cada rodada. Se errar, você pode começar outra partida e tentar superar seu recorde.</p></section></main>
<script>
(()=>{const tiles=[...document.querySelectorAll(".tile")],roundEl=document.querySelector("#round"),bestEl=document.querySelector("#best"),statusEl=document.querySelector("#status"),startBtn=document.querySelector("#start"),repeatBtn=document.querySelector("#repeat");const tones=[392,494,587,740];let sequence=[],step=0,playing=false,locked=true,best=0,audio;bestEl.textContent=best;function tone(i,duration=.22){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";osc.frequency.value=tones[i];gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.018);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration+.03)}catch(e){}}function light(i,duration=300){tiles[i].classList.add("lit");tone(i,Math.min(duration/1000,.3));setTimeout(()=>tiles[i].classList.remove("lit"),duration)}function setEnabled(value){tiles.forEach(t=>t.disabled=!value)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function playSequence(){locked=true;setEnabled(false);repeatBtn.classList.remove("hidden");statusEl.textContent="Preste atenção...";await sleep(450);for(const i of sequence){light(i,300);await sleep(520)}locked=false;step=0;setEnabled(true);statusEl.textContent="Sua vez! Repita a sequência."}function newGame(){sequence=[];playing=true;roundEl.textContent="0";startBtn.textContent="Recomeçar";nextRound()}function nextRound(){sequence.push(Math.floor(Math.random()*4));roundEl.textContent=sequence.length;playSequence()}function endGame(){playing=false;locked=true;setEnabled(false);repeatBtn.classList.add("hidden");statusEl.textContent=`Fim de jogo! Você chegou à rodada ${sequence.length}. Toque em Começar para jogar de novo.`}startBtn.addEventListener("click",newGame);repeatBtn.addEventListener("click",()=>{if(playing&&!locked)playSequence()});tiles.forEach((tile,i)=>tile.addEventListener("click",()=>{if(!playing||locked)return;light(i,180);if(i!==sequence[step]){endGame();return}step++;if(step===sequence.length){locked=true;setEnabled(false);if(sequence.length>best){best=sequence.length;bestEl.textContent=best}statusEl.textContent="Muito bem! Próxima rodada...";setTimeout(nextRound,650)}}));})();
</script></body></html>
